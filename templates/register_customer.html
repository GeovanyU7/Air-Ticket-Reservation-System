<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #1e3c72;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
        }

        input:focus {
            outline: none;
            border-color: #1e3c72;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(30, 60, 114, 0.4);
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1e3c72;
            text-decoration: none;
        }

        .section-title {
            color: #1e3c72;
            font-size: 1.2em;
            margin-top: 20px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👤 Customer Registration</h1>

        {% if error %}
        <div class="error">{{error}}</div>
        {% endif %}

        <form action="/register_customer" method="POST">
            <div class="section-title">Account Information</div>
            
            <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Password *</label>
                <input type="password" name="password" required>
            </div>

            <div class="section-title">Personal Information</div>

            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" name="name" required>
            </div>

            <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" name="phone_number" placeholder="+1-XXX-XXX-XXXX" required>
            </div>

            <div class="form-group">
                <label>Date of Birth *</label>
                <input type="date" name="date_of_birth" required>
            </div>

            <div class="section-title">Passport Information</div>

            <div class="form-group">
                <label>Passport Number *</label>
                <input type="text" name="passport_number" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Passport Expiration *</label>
                    <input type="date" name="passport_expiration" required>
                </div>

                <div class="form-group">
                    <label>Passport Country *</label>
                    <input type="text" name="passport_country" required>
                </div>
            </div>

            <div class="section-title">Address</div>

            <div class="form-row">
                <div class="form-group">
                    <label>Building Number *</label>
                    <input type="text" name="building_number" required>
                </div>

                <div class="form-group">
                    <label>Street *</label>
                    <input type="text" name="street" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>City *</label>
                    <input type="text" name="city" required>
                </div>

                <div class="form-group">
                    <label>State *</label>
                    <input type="text" name="state" required>
                </div>
            </div>

            <button type="submit" class="btn">Register</button>
        </form>

        <a href="/login_customer" class="back-link">Already have an account? Login</a> |
        <a href="/" class="back-link">Home</a>
    </div>
</body>
</html>
