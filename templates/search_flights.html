<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Flights</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #1e3c72;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1e3c72;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(30, 60, 114, 0.4);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1e3c72;
            text-decoration: none;
        }

        .trip-type {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .trip-type label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #return_date_group {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Search Flights</h1>
        
        <form action="/search_flights" method="POST">
            <div class="trip-type">
                <label>
                    <input type="radio" name="trip_type" value="oneway" checked onchange="toggleReturnDate()"> One Way
                </label>
                <label>
                    <input type="radio" name="trip_type" value="roundtrip" onchange="toggleReturnDate()"> Round Trip
                </label>
            </div>

            <div class="form-group">
                <label>From (City or Airport Code)</label>
                <input type="text" name="source" placeholder="e.g., New York or JFK" required>
            </div>

            <div class="form-group">
                <label>To (City or Airport Code)</label>
                <input type="text" name="destination" placeholder="e.g., Shanghai or PVG" required>
            </div>

            <div class="form-group">
                <label>Departure Date</label>
                <input type="date" name="departure_date" required>
            </div>

            <div class="form-group" id="return_date_group">
                <label>Return Date</label>
                <input type="date" name="return_date">
            </div>

            <button type="submit" class="btn">Search Flights</button>
        </form>

        <a href="{{ home_url }}" class="back-link">← Back to Home</a>
    </div>

    <script>
        function toggleReturnDate() {
            const tripType = document.querySelector('input[name="trip_type"]:checked').value;
            const returnDateGroup = document.getElementById('return_date_group');
            
            if (tripType === 'roundtrip') {
                returnDateGroup.style.display = 'block';
                document.querySelector('input[name="return_date"]').required = true;
            } else {
                returnDateGroup.style.display = 'none';
                document.querySelector('input[name="return_date"]').required = false;
            }
        }

        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        document.querySelector('input[name="departure_date"]').min = today;
        document.querySelector('input[name="return_date"]').min = today;
    </script>
</body>
</html>
