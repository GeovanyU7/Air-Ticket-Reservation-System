<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #1e3c72;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1e3c72;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(30, 60, 114, 0.4);
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1e3c72;
            text-decoration: none;
        }

        .phone-group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .phone-group input {
            flex: 1;
        }

        .add-phone-btn {
            padding: 12px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👨‍✈️ Airline Staff Registration</h1>

        {% if error %}
        <div class="error">{{error}}</div>
        {% endif %}

        <form action="/register_staff" method="POST">
            <div class="form-group">
                <label>Username *</label>
                <input type="text" name="username" required>
            </div>

            <div class="form-group">
                <label>Password *</label>
                <input type="password" name="password" required>
            </div>

            <div class="form-group">
                <label>Airline *</label>
                <select name="airline_name" required>
                    <option value="">Select Airline</option>
                    {% for airline in airlines %}
                    <option value="{{airline.airline_name}}">{{airline.airline_name}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" name="first_name" required>
                </div>

                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" name="last_name" required>
                </div>
            </div>

            <div class="form-group">
                <label>Date of Birth *</label>
                <input type="date" name="date_of_birth" required>
            </div>

            <div id="phone-container">
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" name="phone_number" placeholder="+1-XXX-XXX-XXXX" required>
                </div>
            </div>

            <button type="button" class="add-phone-btn" onclick="addPhone()">+ Add Another Phone</button>

            <button type="submit" class="btn">Register</button>
        </form>

        <a href="/login_staff" class="back-link">Already have an account? Login</a> |
        <a href="/" class="back-link">Home</a>
    </div>

    <script>
        function addPhone() {
            const container = document.getElementById('phone-container');
            const div = document.createElement('div');
            div.className = 'form-group';
            div.innerHTML = `
                <label>Additional Phone Number</label>
                <input type="tel" name="phone_number" placeholder="+1-XXX-XXX-XXXX">
            `;
            container.appendChild(div);
        }
    </script>
</body>
</html>
